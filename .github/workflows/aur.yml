name: Prepare and publish AUR package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to prepare (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') && !contains(github.event.release.tag_name || inputs.tag, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate stable semver
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH releases can update the AUR." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download published checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*_checksums.txt' --dir release

      - name: Render AUR metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/aur/render.sh "$VERSION" release/*_checksums.txt aur-package

      - name: Upload reviewed metadata candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doitdoit-bin-${{ steps.version.outputs.version }}
          include-hidden-files: true
          path: |
            aur-package/PKGBUILD
            aur-package/.SRCINFO
            aur-package/LICENSE

  publish:
    needs: prepare
    if: ${{ vars.AUR_PUBLISH_ENABLED == 'true' }}
    environment: aur
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: doitdoit-bin-${{ needs.prepare.outputs.version }}
          path: aur-package

      - name: Configure dedicated AUR key and verify host fingerprint
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur-doitdoit"
          chmod 600 "$HOME/.ssh/aur-doitdoit"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur-known-hosts"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/aur-known-hosts" | awk '{print $2}')
          expected='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          if [[ "$actual" != "$expected" ]]; then
            echo "AUR SSH host fingerprint mismatch: $actual" >&2
            exit 1
          fi
          install -m 600 "$RUNNER_TEMP/aur-known-hosts" "$HOME/.ssh/known_hosts"
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile %s/.ssh/aur-doitdoit\n  IdentitiesOnly yes\n' "$HOME" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Clone existing AUR repository and guard version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git clone ssh://aur@aur.archlinux.org/doitdoit-bin.git aur-repository
          if [[ ! -f aur-repository/.SRCINFO ]]; then
            echo "Refusing automated initial publication; push the first master commit manually." >&2
            exit 1
          fi
          current=$(awk '$1 == "pkgver" && $2 == "=" {print $3; exit}' aur-repository/.SRCINFO)
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)
          if [[ "$newest" != "$VERSION" || "$current" == "$VERSION" ]]; then
            echo "Refusing equal-version or downgrade publication: current=$current candidate=$VERSION" >&2
            exit 1
          fi

      - name: Publish reviewed metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          install -m 644 aur-package/PKGBUILD aur-repository/PKGBUILD
          install -m 644 aur-package/.SRCINFO aur-repository/.SRCINFO
          install -m 644 aur-package/LICENSE aur-repository/LICENSE
          cd aur-repository
          git config user.name 'David Thompson'
          git config user.email 'davidt@hey.com'
          git add PKGBUILD .SRCINFO LICENSE
          git diff --cached --exit-code && { echo 'No AUR metadata changes to publish.' >&2; exit 1; }
          git commit -m "doitdoit-bin ${VERSION}-1"
          git push origin HEAD:master
